width: 400
height: 200

materials:
  - name: teapot_mat
    reflective: 0.0

scene:
  objects:
    - name: teapot
      file: ../resources/teapot_high.obj
      material: teapot_mat
      transforms:
        - type: rotation
          x: -90

light:
  p:
    x: -3
    y: 30
    z: -20
  intensity:
    r: 255
    g: 255
    b: 255

camera:
  from:
    x: 0
    y: 25
    z: -30
  lookAt: teapot
  up:
    x: 0
    y: 1
    z: 0
  animation:
    degrees: 180
    timeSec: 5
    fps: 12